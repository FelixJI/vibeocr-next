[project]
name = "vibeocr-next-runtime"
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=12.3.0", "numpy>=2.3.5", "httpx>=0.28.1",
    "jsonschema>=4.25.0", "pymupdf>=1.28.0", "pydantic>=2.13.4",
    "fastapi>=0.139.0", "uvicorn>=0.51.0", "fonttools>=4.63.0",
    "markdown>=3.10.2", "python-docx>=1.2.0", "openpyxl>=3.1.5",
    "qrcode[pil]>=8.2", "python-barcode>=0.16.1", "pyzbar>=0.1.9",
    "pynvml>=11.5.0", "packaging>=26.0", "python-multipart>=0.0.32",
]

[project.scripts]
vibeocr-supervisor = "vibeocr.runtime.host.main:main"
vibeocr-runtime-installer = "vibeocr.runtime.environments.runtime_installer:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "repository.json"
pattern = '"version": "(?P<version>[^\"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/runtime/vibeocr", "contracts/runtime/python/vibeocr"]
dev-mode-dirs = ["src/runtime", "contracts/runtime/python"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]
build = [
    "pyinstaller==6.21.0",
    "setuptools==84.0.0",
    "pip==26.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/runtime", "tests/python"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
markers = ["slow: long-running integration or performance test"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["contracts/runtime/python/vibeocr/runtime_contracts/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
