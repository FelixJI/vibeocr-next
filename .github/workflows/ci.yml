name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: windows-latest
    outputs:
      sharded: ${{ steps.plan.outputs.sharded }}
      matrix: ${{ steps.plan.outputs.matrix }}
      handoff-paths: ${{ steps.plan.outputs.handoff_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Plan repository gates
        id: plan
        run: >-
          python scripts/automation.py ci
          --phase plan
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'

  prepare:
    needs: plan
    if: needs.plan.outputs.sharded == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install declared npm version
        if: hashFiles('**/package-lock.json') != ''
        run: |
          $manager = (Get-Content src/dotnet/VibeOCR.App/WebAssets/package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $manager
          if ($LASTEXITCODE -ne 0) { throw 'Declared npm installation failed' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Build immutable candidate after pre-release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/automation.py ci
          --phase prepare
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'
      - name: Upload immutable candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-candidate-handoff
          path: ${{ needs.plan.outputs.handoff-paths }}
          if-no-files-found: error
          retention-days: 1

  shard:
    needs: [plan, prepare]
    if: needs.plan.outputs.sharded == 'true' && needs.prepare.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.uv == true
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.dotnet == true && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.node == true && hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install declared npm version
        if: matrix.node == true && hashFiles('**/package-lock.json') != ''
        run: |
          $manager = (Get-Content src/dotnet/VibeOCR.App/WebAssets/package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $manager
          if ($LASTEXITCODE -ne 0) { throw 'Declared npm installation failed' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == true && hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Download immutable candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-candidate-handoff
          path: .
      - name: Verify immutable candidate lane
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHARD_LANE: ${{ matrix.name }}
        run: >-
          python scripts/automation.py ci
          --phase shard
          --lane $env:CI_SHARD_LANE
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-${{ matrix.name }}
          path: build/automation/lane-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  required:
    needs: [plan, prepare, shard]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    name: required
    runs-on: windows-latest
    steps:
      - name: Fail closed on orchestration errors
        env:
          CI_SHARDED: ${{ needs.plan.outputs.sharded }}
          CI_PLAN_RESULT: ${{ needs.plan.result }}
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARD_RESULT: ${{ needs.shard.result }}
        shell: pwsh
        run: |
          if ($env:CI_PLAN_RESULT -ne 'success') { exit 1 }
          if ($env:CI_SHARDED -eq 'true') {
            if ($env:CI_PREPARE_RESULT -ne 'success' -or $env:CI_SHARD_RESULT -ne 'success') { exit 1 }
          } elseif ($env:CI_SHARDED -eq 'false') {
            if ($env:CI_PREPARE_RESULT -ne 'skipped' -or $env:CI_SHARD_RESULT -ne 'skipped') { exit 1 }
          } else {
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.plan.outputs.sharded != 'true'
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install declared npm version
        if: needs.plan.outputs.sharded != 'true' && hashFiles('**/package-lock.json') != ''
        run: |
          $manager = (Get-Content src/dotnet/VibeOCR.App/WebAssets/package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $manager
          if ($LASTEXITCODE -ne 0) { throw 'Declared npm installation failed' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Download immutable candidate handoff
        if: needs.plan.outputs.sharded == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-candidate-handoff
          path: .
      - name: Download lane evidence
        if: needs.plan.outputs.sharded == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-lane-*
          path: build/automation/lane-reports
          merge-multiple: true
      - name: Verify repository
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHARDED: ${{ needs.plan.outputs.sharded }}
        shell: pwsh
        run: |
          if ($env:CI_SHARDED -eq 'true') {
            python scripts/automation.py ci `
              --phase finalize `
              --reports-dir 'build/automation/lane-reports' `
              --event '${{ github.event_name }}' `
              --source-sha '${{ github.sha }}'
          } else {
            python scripts/automation.py ci `
              --event '${{ github.event_name }}' `
              --source-sha '${{ github.sha }}'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload main release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: build/automation/release-candidate
          if-no-files-found: error
          retention-days: 14
