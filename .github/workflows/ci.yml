name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
        if: hashFiles('global.json') != ''
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 --repo FelixJI/vibeocr-protocol --dir .release-input/protocol
          gh release download v0.7.0 --repo FelixJI/vibeocr-backend --dir .release-input/backend
          python scripts/bind_component_releases.py product-lock --protocol-release-dir .release-input/protocol --backend-release-dir .release-input/backend --protocol-repository FelixJI/vibeocr-protocol --protocol-version 2.0.0 --backend-repository FelixJI/vibeocr-backend --backend-version 0.7.0 --profile win-x64-cpu --required-capability ocr.recognition.v2 --required-capability pdf.edit.v2 --required-capability qrcode.v2 --required-capability export.document.v1 --required-capability runtime.settings.v2 --output .release-input/component-lock.json
          $generatedLock = Get-Content .release-input/component-lock.json -Raw | ConvertFrom-Json | ConvertTo-Json -Depth 100 -Compress
          $committedLock = Get-Content component-lock.json -Raw | ConvertFrom-Json | ConvertTo-Json -Depth 100 -Compress
          if ($generatedLock -ne $committedLock) { throw 'component lock mismatch' }
          dotnet restore tests/dotnet/VibeOCR.Platform.Tests/VibeOCR.Platform.Tests.csproj --locked-mode
          dotnet restore tests/dotnet/VibeOCR.App.Tests/VibeOCR.App.Tests.csproj --locked-mode
          dotnet test tests/dotnet/VibeOCR.Platform.Tests/VibeOCR.Platform.Tests.csproj -c Release --no-restore
          dotnet test tests/dotnet/VibeOCR.App.Tests/VibeOCR.App.Tests.csproj -c Release --no-restore --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none --logger "console;verbosity=detailed"
          ./scripts/build-release.ps1
