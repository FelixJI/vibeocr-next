                    "type": "string",
                    "minLength": 1
                  },
                  "session_revision": {
                    "type": "string",
                    "minLength": 1
                  },
                  "page_index": {
                    "type": "integer",
                    "minimum": 0
                  }
                }
              }
            ]
          }
        }
      },
      "SubmitRequest": {
        "type": "object",
        "required": [
          "schema_version",
          "request_id",
          "kind",
          "priority",
          "pipeline",
          "items",
          "parameters"
        ],
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "integer",
            "const": 2
          },
          "request_id": {
            "type": "string",
            "minLength": 1
          },
          "kind": {
            "type": "string",
            "enum": [
              "recognition",
              "pdf_ocr",
              "mineru_parse"
            ]
          },
          "priority": {
            "type": "string",
            "enum": [
              "interactive",
              "background"
            ]
          },
          "pipeline": {
            "$ref": "#/components/schemas/PipelineSelection"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/SubmitItem"
            }
          },
          "parameters": {
            "type": "object"
          }
        }
      },
      "TextBlockMirror": {
        "description": "单个 OCR 文本块(对应 models.ocr_result.TextBlock 的可序列化投影)。\n\nocr_text_blocks 在 PdfPageInfo 里是 list[TextBlock],跨进程序列化时\n只保留写入 PDF / 预览所需的字段。上游无置信度时 score=0.0 且\nscore_unknown=true；权威 unknown 在 ocr.v1 结果的 text_blocks[].score=null。",
        "properties": {
          "text": {
            "title": "Text",
            "type": "string"
          },
          "score": {
            "title": "Score",
            "type": "number"
          },
          "score_unknown": {
            "default": false,
            "description": "true 表示上游未提供置信度（score 的 0.0 只是 wire 兼容占位）。",
            "title": "Score Unknown",
            "type": "boolean"
          },
          "bbox": {
            "anyOf": [
              {
                "maxItems": 4,
                "minItems": 4,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Bbox"
          },
          "polygon": {
            "anyOf": [
              {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Polygon"
          },
          "page_idx": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Page Idx"
          },
          "is_manually_edited": {
            "default": false,
            "title": "Is Manually Edited",
            "type": "boolean"
          },
          "label": {
            "default": "text",
            "title": "Label",
            "type": "string"
          },
          "order": {
            "default": -1,
            "title": "Order",
            "type": "integer"
          }
        },
        "required": [
          "text",
          "score"
        ],
        "title": "TextBlockMirror",
        "type": "object",
        "additionalProperties": false
      },
      "TextLayerInfoMirror": {
        "description": "单个文字层信息(对应 models.pdf_document.TextLayerInfo)。",
        "properties": {
          "index": {
            "title": "Index",
            "type": "integer"
          },
          "text_preview": {
            "title": "Text Preview",
            "type": "string"
          },
          "char_count": {
            "title": "Char Count",
            "type": "integer"
          },
          "bbox": {
            "maxItems": 4,
            "minItems": 4,
            "prefixItems": [
              {
                "type": "number"
              },
              {
                "type": "number"
              },
              {
                "type": "number"
              },
              {
                "type": "number"
              }
            ],
            "title": "Bbox",
            "type": "array"
          },
          "color_id": {
            "title": "Color Id",
            "type": "integer"
          }
        },
        "required": [
          "index",
          "text_preview",
          "char_count",
          "bbox",
          "color_id"
        ],
        "title": "TextLayerInfoMirror",
        "type": "object",
        "additionalProperties": false
      },
      "UpdateBlockTextRequest": {
        "description": "双击编辑文字块：原子写入当前内存 doc 后才更新模型。\n\nexpected_old_text 非空时与目标块当前文本严格比对，不一致按 409 拒绝，防止乱序提交覆盖后续编辑。pdf_settings 携带调用方当前写层策略（visible/字号等），避免编辑重写静默恢复默认。",
        "properties": {
          "page": {
            "title": "Page",
            "type": "integer"
          },
          "block_index": {
            "title": "Block Index",
            "type": "integer"
          },
          "new_text": {
            "title": "New Text",
            "type": "string"
          },
          "expected_old_text": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Expected Old Text"
          },
          "pdf_settings": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Pdf Settings"
          }
        },
        "required": [
          "page",
          "block_index",
          "new_text"
        ],
        "type": "object",
        "additionalProperties": false
      }
    }
  }
}
