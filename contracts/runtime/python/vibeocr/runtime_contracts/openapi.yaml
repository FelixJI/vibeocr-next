      "RuntimeInstallPlanRequest": {
        "type": "object",
        "description": "Runtime install plan preview request (runtime.install-plan.v1). required_capabilities MUST include runtime.install-plan.v1; a Backend without the capability rejects the preview as explicitly unsupported instead of silently installing. install_component_ids follows runtime.component-selection.v1 semantics: an empty array explicitly selects no optional components while omission selects the Backend default, and unknown ids fail closed with RUNTIME_COMPONENT_UNKNOWN. download_source_ids follows runtime.download-sources.v1 and MUST NOT be empty when present. Omitting accelerator keeps the persistent preference or product default. The preview installs nothing, downloads no dependencies or models, changes no active environment or persistent selection, and creates no maintenance operation; the Backend may retain short-lived plan metadata for later confirmation.",
        "required": [
          "required_capabilities"
        ],
        "properties": {
          "accelerator": {
            "type": "string",
            "enum": [
              "cpu",
              "nvidia_cuda"
            ]
          },
          "install_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "download_source_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "required_capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            },
            "contains": {
              "const": "runtime.install-plan.v1"
            }
          }
        },
        "additionalProperties": false
      },
      "RuntimeInstallPlanResponse": {
        "type": "object",
        "description": "Runtime install plan preview response. The plan is read-only and creating it is not a maintenance operation. negotiated_capabilities echoes the capabilities the Backend actually negotiated for this preview. Confirming the plan later uses plan_id on an ensure maintenance start or retry, which revalidates the baseline atomically before first execution; replaying the same operation id and plan returns the existing receipt without executing again.",
        "required": [
          "schema_version",
          "plan",
          "negotiated_capabilities"
        ],
        "properties": {
          "schema_version": {
            "const": 2
          },
          "plan": {
            "$ref": "#/components/schemas/RuntimeInstallPlan"
          },
          "negotiated_capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "additionalProperties": false
      },
      "RuntimeInstallPlan": {
        "type": "object",
        "description": "One read-only Runtime install plan. plan_id is opaque and not a client-computed digest; it expires at expires_at. The Backend revalidates the verified release/lock/product baseline before the plan's first execution and rejects stale, expired, or unknown plans with RUNTIME_INSTALL_PLAN_STALE. requested_component_ids and requested_download_source_ids are nullable echoes of the request: null means the field was omitted (Backend default), an empty array explicitly selected no optional components. components is the union of the effective closure and the actually affected old components; ids across all arrays are unique and use release-catalog stable component ids, never pip package graphs, local paths, or credentials. remove means the component no longer belongs to the active environment once the candidate activates; it never authorizes deleting retained environments, native models, or caches. Native model preparation stays with the engine downloaders and is not part of the known dependency totals in cost.",
        "required": [
          "plan_id",
          "expires_at",
          "accelerator",
          "profile_id",
          "requested_component_ids",
          "effective_component_ids",
          "requested_download_source_ids",
          "effective_download_source_ids",
          "source",
          "components",
          "blockers",
          "cost"
        ],
        "properties": {
          "plan_id": {
            "type": "string",
            "minLength": 1
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "accelerator": {
            "type": "string",
            "enum": [
              "cpu",
              "nvidia_cuda"
            ]
          },
          "profile_id": {
            "type": "string",
            "minLength": 1
          },
          "requested_component_ids": {
            "type": [
              "array",
              "null"
            ],
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "effective_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "requested_download_source_ids": {
            "type": [
              "array",
              "null"
            ],
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "effective_download_source_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "source": {
            "$ref": "#/components/schemas/RuntimeSourceIdentity"
          },
          "components": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuntimeInstallPlanComponent"
            }
          },
          "blockers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuntimeInstallPlanBlocker"
            }
          },
          "cost": {
            "$ref": "#/components/schemas/RuntimeInstallPlanCost"
          }
        },
        "additionalProperties": false
      },
      "RuntimeInstallPlanComponent": {
        "type": "object",
        "description": "One component row of the effective install closure union. action describes what confirming this plan does to the component: retain keeps it, install adds it, replace upgrades it in place, and remove means it no longer belongs to the active environment once the candidate activates, without deleting retained environments, native models, or caches. dependency_state reports whether the component's dependencies are satisfied now; entries shared across engines may be satisfied. reason_codes are open machine-readable strings, and entries added to the effective closure beyond the request MUST carry at least one reason code. Device, scope, recognition-mode, and tier differences are separate Backend concerns and never collapse into these fields.",
        "required": [
          "component_id",
          "action",
          "dependency_state",
          "reason_codes"
        ],
        "properties": {
          "component_id": {
            "type": "string",
            "minLength": 1
          },
          "action": {
            "type": "string",
            "enum": [
              "retain",
              "install",
              "replace",
              "remove"
            ]
          },
          "dependency_state": {
            "type": "string",
            "enum": [
              "satisfied",
              "pending"
            ]
          },
          "reason_codes": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "additionalProperties": false
      },
      "RuntimeInstallPlanBlocker": {
        "type": "object",
        "description": "One actual known blocker the Backend honestly reports for the plan, such as platform, ABI, driver, disk space, permission, source, or in-flight task conditions. code is an open stable machine-readable string; next_action names the next user action such as reselect, change_source, free_space, or close_tasks. Confirming a plan with blockers fails closed with RUNTIME_INSTALL_PLAN_BLOCKED.",
        "required": [
          "code",
          "next_action"
        ],
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1
          },
          "component_id": {
            "type": "string",
            "minLength": 1
          },
          "next_action": {
            "type": "string",
            "minLength": 1
          }
        },
        "additionalProperties": false
      },
      "RuntimeInstallPlanCost": {
        "type": "object",
        "description": "Plan-wide deduplicated cost totals, never per-component sums. download_bytes and additional_disk_bytes are non-negative integers or null; null means honestly unknown and MUST come with at least one unknown_reason_code instead of a zero placeholder. Unknown native model preparation costs stay with the engine downloaders and belong in the reason codes, not in these dependency totals.",
        "required": [
          "download_bytes",
          "additional_disk_bytes",
          "unknown_reason_codes"
        ],
        "properties": {
          "download_bytes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "format": "int64"
          },
          "additional_disk_bytes": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "format": "int64"
          },
          "unknown_reason_codes": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "allOf": [
          {
            "if": {
              "anyOf": [
                {
                  "properties": {
                    "download_bytes": {
                      "type": "null"
                    }
                  }
                },
                {
                  "properties": {
                    "additional_disk_bytes": {
                      "type": "null"
                    }
                  }
                }
              ]
            },
            "then": {
              "properties": {
                "unknown_reason_codes": {
                  "minItems": 1
                }
              }
            }
          }
        ],
        "additionalProperties": false
      },
      "RuntimeMaintenanceRequest": {
        "type": "object",
        "description": "Runtime maintenance start request. For ensure, install_component_ids is the manual optional-component scope: an empty array explicitly selects no optional components, omission selects the Backend default, and unknown ids fail closed with RUNTIME_COMPONENT_UNKNOWN. download_source_ids snapshots at most one source per kind into the operation; each present kind overrides its current setting/default and kinds not present use the Backend-declared default for that kind. Omitting the field snapshots the current Backend setting/default. Clients MUST omit both fields when their capability is absent; they are invalid for inspect/repair. component_ids keeps its repair-scope meaning. plan_id (runtime.install-plan.v1) confirms a previewed install plan for ensure only: it requires an explicit operation_id and required_capabilities containing runtime.install-plan.v1, is mutually exclusive with profile_id, component_ids, install_component_ids, and download_source_ids, and the Backend revalidates the plan baseline atomically before first execution, rejecting stale, expired, or unknown plans with RUNTIME_INSTALL_PLAN_STALE and blocked plans with RUNTIME_INSTALL_PLAN_BLOCKED. Requests without plan_id keep their legacy semantics and never claim user plan confirmation.",
        "required": [
          "operation"
        ],
        "properties": {
          "operation_id": {
            "type": "string",
            "minLength": 1
          },
          "operation": {
            "type": "string",
            "enum": [
              "inspect",
              "ensure",
              "repair"
            ]
          },
          "profile_id": {
            "type": "string",
            "minLength": 1
          },
          "plan_id": {
            "type": "string",
            "minLength": 1
          },
          "component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "install_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "download_source_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "required_capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "allOf": [
          {
            "if": {
              "anyOf": [
                {
                  "required": [
                    "install_component_ids"
                  ]
                },
                {
                  "required": [
                    "download_source_ids"
                  ]
                }
              ]
            },
            "then": {
              "properties": {
                "operation": {
                  "const": "ensure"
                }
              }
            }
          },
          {
            "if": {
              "required": [
                "plan_id"
              ]
            },
            "then": {
              "required": [
                "operation_id",
                "required_capabilities"
              ],
              "properties": {
                "operation": {
                  "const": "ensure"
                },
                "required_capabilities": {
                  "contains": {
                    "const": "runtime.install-plan.v1"
                  }
                }
              },
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "profile_id"
                    ]
                  },
                  {
                    "required": [
                      "component_ids"
                    ]
                  },
                  {
                    "required": [
                      "install_component_ids"
                    ]
                  },
                  {
                    "required": [
                      "download_source_ids"
                    ]
                  }
                ]
              }
            }
          }
        ],
        "additionalProperties": false
      },
      "RuntimeMaintenanceCommandRequest": {
        "type": "object",
        "description": "Runtime maintenance command request. On retry, install_component_ids and download_source_ids may explicitly replace the source operation's normalized component/source intent; download source ids replace the selected kind while kinds not present use the Backend-declared default for that kind. Omission reuses the source operation intent. An empty install_component_ids array explicitly selects no optional components. Selection fields are invalid for cancel and MUST be omitted when their capability is absent. plan_id (runtime.install-plan.v1) may only ride a retry that replaces the source operation's plan confirmation: it is invalid for cancel, mutually exclusive with install_component_ids and download_source_ids, and requires required_capabilities to contain runtime.install-plan.v1. Reusing a plan id after its operation was accepted replays the existing receipt rather than retrying; a genuinely new retry must preview a fresh plan_id together with a new operation id. Commands without plan_id keep their legacy semantics.",
        "required": [
          "command_id",
          "command",
          "target_operation_id"
        ],
        "properties": {
          "command_id": {
            "type": "string",
            "minLength": 1
          },
          "command": {
            "type": "string",
            "enum": [
              "cancel",
              "retry"
            ]
          },
          "target_operation_id": {
            "type": "string",
            "minLength": 1
          },
          "new_operation_id": {
            "type": "string",
            "minLength": 1
          },
          "expected_sequence": {
            "type": "integer",
            "minimum": 0
          },
          "plan_id": {
            "type": "string",
            "minLength": 1
          },
          "install_component_ids": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "download_source_ids": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "required_capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "command": {
                  "const": "retry"
                }
              },
              "required": [
                "command"
              ]
            },
            "then": {
              "required": [
                "new_operation_id"
              ]
            }
          },
          {
            "if": {
              "anyOf": [
                {
                  "required": [
                    "install_component_ids"
                  ]
                },
                {
                  "required": [
                    "download_source_ids"
                  ]
                }
              ]
            },
            "then": {
              "properties": {
                "command": {
                  "const": "retry"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "command": {
                  "const": "cancel"
                }
              },
              "required": [
                "command"
              ]
            },
            "then": {
              "not": {
                "required": [
                  "plan_id"
                ]
              }
            }
          },
          {
            "if": {
              "required": [
                "plan_id"
              ]
            },
            "then": {
              "properties": {
                "command": {
                  "const": "retry"
                },
                "required_capabilities": {
                  "contains": {
                    "const": "runtime.install-plan.v1"
                  }
                }
              },
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "install_component_ids"
                    ]
                  },
                  {
                    "required": [
                      "download_source_ids"
                    ]
                  }
                ]
              },
              "required": [
                "required_capabilities"
              ]
            }
          }
        ],
        "additionalProperties": false
      },
