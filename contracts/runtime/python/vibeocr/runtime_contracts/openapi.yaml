        "description": "Backend settings snapshot/exchange. download_source_ids persists at most one selected source per kind; array order has no priority meaning. Each present id overrides the source for its kind, while kinds not present use the Backend-declared default for that kind. Maintenance start snapshots this preference into its operation intent. Clients SHOULD send the current selection when the capability is declared and MUST omit it otherwise; an empty in-memory selection MUST serialize as omission. Omission delegates all kinds to Backend-declared defaults and unknown ids fail closed with DOWNLOAD_SOURCE_UNKNOWN.",
