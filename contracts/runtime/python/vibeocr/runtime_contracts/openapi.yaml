      "MineruConfig": {
        "type": "object",
        "description": "Typed MinerU 4 configuration, carried by the optional PipelineSelection.mineru block and protected by the ocr.mineru-config.v1 capability. The block is only valid for kind=mineru_parse jobs with pipeline_id=MinerU; a request that combines it with non-empty legacy options or the engine field fails closed with VALIDATION_ERROR instead of silently dropping either side (server-side conformance case; conditional constraints stay out of the released request schema). tier is required and must not be omitted or set to null. Omitting ocr_mode selects auto, omitting page_range selects all, omitting language selects the upstream default hint ch. language is only an OCR hint the upstream service accepts; it does not guarantee that every tier changes the output language. Clients MUST NOT send this block unless the runtime advertises ocr.mineru-config.v1, and MUST NOT fall back to legacy options or the flash tier when the capability is missing.",
        "required": [
          "tier"
        ],
        "additionalProperties": false,
        "properties": {
          "tier": {
            "$ref": "#/components/schemas/MineruTierId"
          },
          "ocr_mode": {
            "$ref": "#/components/schemas/MineruOcrMode"
          },
          "page_range": {
            "type": "string",
            "pattern": "^(all|r?[1-9][0-9]*(-r?[1-9][0-9]*)?(,r?[1-9][0-9]*(-r?[1-9][0-9]*)?)*)$(?![\\s\\S])",
            "description": "Canonical page subset: the literal all, or a comma-separated list of 1-based positive page indexes and closed ranges; rN counts from the last page and rA-rB denotes a reversed closed range (for example 1-5,8,r3-r1). Zero, r0, empty fragments, surrounding whitespace and mixing all with numbers are rejected syntactically. Actual page counts, range direction/bounds and file types are validated by the Backend against the input; for non-PDF inputs clients may only omit the field or send all, and the Backend maps both to an omitted upstream range. The Protocol never parses PDFs."
          },
          "language": {
            "type": "string",
            "minLength": 1,
            "pattern": "^\\S(?:[\\s\\S]*\\S)?$(?![\\s\\S])",
            "description": "Single upstream OCR language id without surrounding whitespace; omitting selects the upstream default ch. The id must be listed by the ocr.mineru-config.v1 catalog before a client may send it."
          }
        }
      },
      "MineruConfigCatalog": {
        "type": "object",
        "description": "Structured catalog of MinerU 4 tiers and accepted language ids, carried only by the ocr.mineru-config.v1 capability descriptor. The catalog describes the real runtime: listing all four tiers in the wire schema never implies that every tier can run. default_tier is the product default the Backend declares (VibeOCR initially basic); it is not the bare upstream default. Servers MUST NOT list duplicate tier ids and languages. The catalog never carries package names, pip arguments, model file paths, a business dependency graph, display text or product defaults beyond default_tier.",
        "required": [
          "default_tier",
          "tiers",
          "languages"
        ],
        "additionalProperties": false,
        "properties": {
          "default_tier": {
            "$ref": "#/components/schemas/MineruTierId"
          },
          "tiers": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/MineruTierDescriptor"
            }
          },
          "languages": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1
            }
          }
        }
      },
      "MineruOcrMode": {
        "type": "string",
        "x-vibeocr-exact-enum": true,
        "description": "Upstream OCR mode hint for text-layer handling. auto lets the upstream service decide, txt trusts the embedded text layer, and ocr forces recognition. Omitting the field selects auto.",
        "enum": [
          "auto",
          "txt",
          "ocr"
        ]
      },
      "MineruTierAvailability": {
        "type": "string",
        "description": "Availability of one MinerU tier in the current runtime. ready means mineru_parse jobs may select it now; preparation_required means the user must prepare runtime components first; unavailable means the tier cannot run in this runtime. Preparation being finished, models being downloaded or the service being ready never implies by itself that a tier is ready for recognition.",
        "enum": [
          "ready",
          "preparation_required",
          "unavailable"
        ]
      },
      "MineruTierDescriptor": {
        "type": "object",
        "description": "Capability and availability state of one MinerU tier. reason_code is a stable machine-readable cause id that clients localize themselves; the Backend never ships display text.",
