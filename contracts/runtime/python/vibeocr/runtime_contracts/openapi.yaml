{
  "openapi": "3.1.0",
  "info": {
    "title": "VibeOCR Local Runtime API",
    "version": "2.10.0",
    "description": "Authoritative Runtime API v2. The historical openapi.snapshot.json is non-authoritative."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:{port}",
      "variables": {
        "port": {
          "default": "0"
        }
      }
    }
