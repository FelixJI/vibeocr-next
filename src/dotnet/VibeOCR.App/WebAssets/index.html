<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
    <meta name="color-scheme" content="dark light">
    <title>VibeOCR 识别工作台</title>
    <link rel="stylesheet" href="src/theme.css">
  </head>
  <body>
    <main class="workbench" aria-label="识别工作台">
      <section class="inspection-grid">
        <article class="image-bay" aria-labelledby="image-title">
          <header class="section-label">
            <div><span>INPUT / 01</span><h1 id="image-title">输入图像</h1></div>
            <output id="bridge-status" class="status" data-state="booting" aria-live="polite">正在准备预览</output>
          </header>
          <nav class="editor-tools" aria-label="图片标注工具">
            <button type="button" data-editor-tool="select" data-active="true">选择</button>
            <button type="button" data-editor-tool="rect">矩形</button>
            <button type="button" data-editor-tool="ellipse">椭圆</button>
            <button type="button" data-editor-tool="arrow">箭头</button>
            <button type="button" data-editor-tool="text">文字</button>
            <button type="button" data-editor-tool="mosaic">马赛克</button>
            <button type="button" data-editor-tool="blur">模糊</button>
            <button type="button" data-editor-tool="crop">裁剪</button>
            <input id="editor-text-value" type="text" value="文本" aria-label="标注文字" maxlength="120">
            <span class="tool-separator" aria-hidden="true"></span>
            <button id="editor-rotate" type="button">旋转</button>
            <button id="editor-undo" type="button" disabled>撤销</button>
            <button id="editor-redo" type="button" disabled>重做</button>
          </nav>
          <div class="image-stage">
            <img id="preview-image" alt="待识别图片预览" hidden>
            <canvas id="editor-canvas" width="1000" height="1000" aria-label="标注图层"></canvas>
            <div id="image-empty" class="empty-state">
              <strong>等待图片</strong>
              <span>截图、粘贴、选择文件或直接拖入</span>
            </div>
          </div>
        </article>
        <article class="result-bay" aria-labelledby="result-title">
          <header class="section-label">
            <div><span>OUTPUT / 02</span><h2 id="result-title">识别结果</h2></div>
          </header>
          <div id="result-text" tabindex="0"><p class="result-empty">识别后，文本与结构化内容会显示在这里。</p></div>
        </article>
      </section>
    </main>
    <script type="module" src="src/preview.js"></script>
  </body>
</html>
